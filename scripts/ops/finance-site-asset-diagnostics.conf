# Included in nginx http context. Keep the ordinary access.log as well.
# No request bodies, cookies, authorization headers or query strings are logged.
map $uri $finance_asset_diagnostic {
    default 0;
    ~^/_next/static/ 1;
    /api/error-reports 1;
    /macro 1;
}
log_format finance_asset_json escape=json
    '{"time":"$time_iso8601","request_id":"$request_id",'
    '"host":"$host","client":"$remote_addr","method":"$request_method",'
    '"uri":"$uri","status":"$status","complete":"$request_completion",'
    '"body_bytes":"$body_bytes_sent","request_seconds":"$request_time",'
    '"upstream_status":"$upstream_status","upstream_seconds":"$upstream_response_time",'
    '"upstream_bytes":"$upstream_response_length","upstream_length":"$upstream_http_content_length",'
    '"sent_length":"$sent_http_content_length","upstream_encoding":"$upstream_http_content_encoding",'
    '"sent_encoding":"$sent_http_content_encoding","gzip_ratio":"$gzip_ratio",'
    '"etag":"$sent_http_etag","protocol":"$server_protocol",'
    '"connection":"$connection","connection_requests":"$connection_requests",'
    '"user_agent":"$http_user_agent"}';
access_log /var/log/nginx/finance-site-assets.jsonl finance_asset_json if=$finance_asset_diagnostic;
