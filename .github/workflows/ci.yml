name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  billing-integration:
    name: billing-integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: billing-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:billing-ci-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Upgrade baseline schema and exercise payment transactions
        run: npm run test:billing-integration
  build:
    name: build
    runs-on: ubuntu-latest
    env:
      # prisma generate 需要 DATABASE_URL，CI 不连真实库
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Unit and architecture tests
        run: npm test

      - name: Validate Prisma schema
        run: npm run test:schema

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Next 构建时部分路由需要占位环境变量
          APP_BASE_URL: http://localhost:3000
