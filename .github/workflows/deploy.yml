name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Deployments publish code and bounded database definitions only. Data
    # acquisition and maintenance run outside the deploy SSH session.
    timeout-minutes: 60
    env:
      DEPLOY_USER: root
      DEPLOY_PATH: /opt/finance-site
      DEPLOY_PORT: "22"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Commit gate
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          APP_BASE_URL: http://localhost:3000
        run: npm run verify:commit

      - name: Pack release tarball
        run: node scripts/deploy-pack.mjs

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: deploy-tarball
          path: deploy.tar.gz
          retention-days: 7

      - name: Validate deploy secrets
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "::error::GitHub Secret DEPLOY_HOST is empty"
            exit 1
          fi
          if [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "::error::GitHub Secret DEPLOY_SSH_KEY is empty"
            exit 1
          fi
          if ! printf '%s' "${{ secrets.DEPLOY_SSH_KEY }}" | grep -q "BEGIN.*PRIVATE KEY"; then
            echo "::error::DEPLOY_SSH_KEY must be a full private key (BEGIN ... PRIVATE KEY)"
            exit 1
          fi

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known_hosts
        run: ssh-keyscan -H -p "${DEPLOY_PORT}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy tarball to server
        run: |
          scp_once() {
            scp -P "${DEPLOY_PORT}" \
              -o ServerAliveInterval=15 -o ServerAliveCountMax=6 -o ConnectTimeout=30 \
              deploy.tar.gz "${DEPLOY_USER}@${{ secrets.DEPLOY_HOST }}:${DEPLOY_PATH}/"
          }
          scp_once || { echo "::warning::First scp attempt failed; retrying once in 10 seconds"; sleep 10; scp_once; }

      - name: Extract and restart on server
        run: |
          ssh -p "${DEPLOY_PORT}" \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=6 -o ConnectTimeout=30 \
            "${DEPLOY_USER}@${{ secrets.DEPLOY_HOST }}" <<EOF
          set -euo pipefail
          cd "${DEPLOY_PATH}"
          site_stopped=0
          restore_site() {
            if [ "\$site_stopped" = "1" ]; then
              cd "${DEPLOY_PATH}"
              pm2 restart finance-site || pm2 start npm --name finance-site -- run start
              pm2 save || true
            fi
          }
          trap restore_site EXIT
          site_stopped=1
          pm2 stop finance-site || true
          rm -rf .next node_modules
          tar -xzf deploy.tar.gz
          rm -f deploy.tar.gz

          # Stage H 只在部署时幂等安装 cron 定义；外部数据获取仍由 cron 执行，
          # 不进入部署 SSH 会话。heartbeat monitor 与日常任务使用独立 flock。
          install -m 0644 scripts/ops/finance-site-sector-regime.cron /etc/cron.d/finance-site-sector-regime
          install -m 0644 scripts/ops/finance-site-sector-history.cron /etc/cron.d/finance-site-sector-history
          install -m 0644 scripts/ops/finance-site-quant-monthly.cron /etc/cron.d/finance-site-quant-monthly
          install -m 0644 scripts/ops/finance-site-data.logrotate /etc/logrotate.d/finance-site-data
          chmod +x scripts/ops/host-diagnostics-snapshot.sh scripts/ops/host-diagnostics-boot.sh

          # Fast deploy: migrations plus catalog definitions, subscriptions,
          # release packages and layout. No history backfills, calendar fetches,
          # equity discovery, global verification or quant rebuilds happen here.
          # Schema and code-owned catalog definitions are deployment gates. A green
          # workflow must mean migrations and release-package membership reached DB.
          npm run db:migrate
          npm run data:apply -- --skip-migrate --skip-equity --skip-calendar --skip-backfill --skip-verify

          pm2 restart finance-site || pm2 start npm --name finance-site -- run start
          pm2 save
          site_stopped=0
          trap - EXIT
          sleep 5
          curl -fsS -o /dev/null http://127.0.0.1:3000/ || (pm2 logs finance-site --lines 40 --nostream; exit 1)

          # A successful home-page response alone can mask an incomplete Next
          # artifact. The route can become available a few seconds after PM2
          # reports the process online, so retry before declaring it missing.
          # Without a session the endpoint is expected to return 401, not 404.
          macro_prefs_status=""
          for attempt in {1..12}; do
            macro_prefs_status=\$(curl -sS --connect-timeout 2 --max-time 5 \
              -o /dev/null -w "%{http_code}" \
              http://127.0.0.1:3000/api/tools/macro-chart-prefs || true)
            if [ "\$macro_prefs_status" = "401" ]; then
              break
            fi
            sleep 2
          done
          if [ "\$macro_prefs_status" != "401" ]; then
            echo "[deploy] macro template preferences API unavailable (HTTP \$macro_prefs_status)"
            pm2 logs finance-site --lines 40 --nostream
            exit 1
          fi

          # Application integrity guard: local DB check only, no network fetch.
          npm run equity:assert-seeded
          EOF
